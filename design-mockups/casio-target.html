<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JY Time Casio Source Mockup</title>
<style>
  @font-face {
    font-family: "NotoMonoCondensed";
    src: url("vendor/noto/NotoSansMono-CondensedBold.ttf") format("truetype");
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #181818;
    color: #f5f5ef;
    font-family: "NotoMonoCondensed", monospace;
  }
  .stage {
    display: grid;
    gap: 16px;
    justify-items: center;
    padding: 28px;
  }
  .label {
    color: #d3b64d;
    font: 700 12px/1 "NotoMonoCondensed", monospace;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  .watch {
    position: relative;
    width: 200px;
    height: 228px;
    overflow: hidden;
    transform: scale(3);
    transform-origin: top center;
    background: #000 url("vendor/royale/images/bg-red.png") 0 0 / 200px 228px no-repeat;
    image-rendering: pixelated;
    box-shadow: 0 0 0 1px #555, 0 14px 40px rgba(0,0,0,.5);
  }
  .spacer { height: 456px; }

  .pebble-logo {
    position: absolute;
    left: 9px;
    top: 3px;
    width: 51px;
    height: 16px;
    image-rendering: pixelated;
  }
  .date-cover {
    position: absolute;
    left: 87px;
    top: 117px;
    width: 72px;
    height: 23px;
    background: #cad2bd;
  }
  .date-text {
    position: absolute;
    left: 92px;
    top: 122px;
    width: 61px;
    color: #050505;
    font: 700 7px/1 "NotoMonoCondensed", monospace;
    text-align: center;
    white-space: nowrap;
  }
  .event-cover {
    position: absolute;
    left: 50px;
    top: 212px;
    width: 102px;
    height: 12px;
    background: #000;
  }
  .event-text {
    position: absolute;
    left: 22px;
    right: 22px;
    bottom: 5px;
    color: #d7bd31;
    font: 700 7px/1 "NotoMonoCondensed", monospace;
    text-align: center;
    white-space: nowrap;
  }

  .sprite {
    position: absolute;
    background-repeat: no-repeat;
    image-rendering: pixelated;
  }
  .digit-lg {
    width: 23px;
    height: 37px;
    background-image: url("vendor/royale/images/type-lg.png");
  }
  .digit-med {
    width: 16px;
    height: 27px;
    background-image: url("vendor/royale/images/type-med.png");
  }
  .digit-small {
    width: 7px;
    height: 14px;
    background-image: url("vendor/royale/images/type-small.png");
  }
  .d0 { background-position: 0 0; }
  .d1 { background-position: -23px 0; }
  .d3 { background-position: -69px 0; }
  .d5 { background-position: -115px 0; }
  .dm0 { background-position: 0 0; }
  .dm1 { background-position: -16px 0; }
  .dm3 { background-position: -48px 0; }
  .dm5 { background-position: -80px 0; }
  .ds0 { background-position: 0 0; }
  .ds1 { background-position: -7px 0; }
  .ds3 { background-position: -21px 0; }
  .ds5 { background-position: -35px 0; }
  .ds7 { background-position: -49px 0; }

  .pm-source {
    position: absolute;
    left: 23px;
    top: 153px;
    width: 17px;
    height: 6px;
    background: url("vendor/royale/images/pm.png") 0 0 / 17px 6px no-repeat;
    image-rendering: pixelated;
  }

  /* Copied from Royale source constants: HR_DIGIT_X 30, HR_DIGIT_Y 147. */
  .h1 { left: 30px; top: 147px; }
  .h2 { left: 56px; top: 147px; }
  .m1 { left: 90px; top: 147px; }
  .m2 { left: 115px; top: 147px; }
  .colon {
    position: absolute;
    left: 81px;
    top: 157px;
    width: 5px;
    height: 21px;
  }
  .colon::before,
  .colon::after {
    content: "";
    position: absolute;
    left: 0;
    width: 5px;
    height: 5px;
    background: #000;
  }
  .colon::before { top: 0; }
  .colon::after { bottom: 0; }

  .steps-panel {
    position: absolute;
    left: 110px;
    top: 113px;
    width: 60px;
    height: 27px;
    background: #cad2bd;
    border: 2px solid #00075e;
    border-radius: 3px;
  }
  .walk-icon {
    position: absolute;
    left: 96px;
    top: 119px;
    width: 10px;
    height: 16px;
    color: #00075e;
  }
  .step-digit-1 { left: 116px; top: 117px; }
  .step-digit-2 { left: 132px; top: 117px; }
  .step-digit-3 { left: 148px; top: 117px; }

  .comp {
    position: absolute;
    top: 187px;
    width: 31px;
    height: 31px;
    border: 2px solid #2740ff;
    border-radius: 50%;
    background: #fffdf5;
    color: #000;
  }
  .comp.battery { left: 31px; }
  .comp.rain { left: 84px; }
  .comp.weather { left: 137px; }
  .comp svg {
    position: absolute;
    left: 50%;
    top: 5px;
    transform: translateX(-50%);
  }
  .comp .value {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4px;
    font: 700 7px/1 "NotoMonoCondensed", monospace;
    text-align: center;
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="label">Casio Source Mockup - Copy First</div>
    <section class="watch" aria-label="Casio source-based watchface mockup">
      <img class="pebble-logo" src="vendor/w800/images/pebble-logo-white.png" alt="Pebble">

      <div class="date-cover" aria-hidden="true"></div>
      <div class="date-text">THURSDAY, MAY 7</div>

      <div class="steps-panel" aria-hidden="true"></div>
      <svg class="walk-icon" viewBox="0 0 12 17" aria-hidden="true">
        <circle cx="6" cy="2.5" r="2" fill="currentColor"/>
        <path d="M5.5 5 3 8.5l2 1.2 1.1-1.9 1.5 3.3-3.5 3.3 1.4 1.5 4.3-4.1L8.2 7.9 10.5 9l.9-1.8L7.3 5Z" fill="currentColor"/>
      </svg>
      <span class="sprite digit-med dm1 step-digit-1"></span>
      <span class="sprite digit-med dm1 step-digit-2"></span>
      <span class="sprite digit-med dm0 step-digit-3"></span>

      <span class="pm-source" aria-hidden="true"></span>
      <span class="sprite digit-lg d1 h1"></span>
      <span class="sprite digit-lg d1 h2"></span>
      <span class="colon" aria-hidden="true"></span>
      <span class="sprite digit-lg d3 m1"></span>
      <span class="sprite digit-lg d5 m2"></span>

      <div class="comp battery">
        <svg width="10" height="14" viewBox="0 0 16 20" aria-hidden="true">
          <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M6 1h4l1 4H5l1-4ZM3 5h10v10H3zM5 15h6l-1 4H6l-1-4Z"/>
          <path stroke="currentColor" stroke-width="1.5" d="M5 8h6"/>
        </svg>
        <span class="value">100</span>
      </div>
      <div class="comp rain">
        <svg width="12" height="14" viewBox="0 0 20 20" aria-hidden="true">
          <path fill="currentColor" d="M10 1C7 5 4 8 4 12a6 6 0 0 0 12 0c0-4-3-7-6-11Z"/>
        </svg>
        <span class="value">94%</span>
      </div>
      <div class="comp weather">
        <svg width="17" height="12" viewBox="0 0 24 18" aria-hidden="true">
          <path fill="currentColor" d="M7 15h11a5 5 0 0 0 0-10 7 7 0 0 0-13-1A5.5 5.5 0 0 0 7 15Z"/>
        </svg>
        <span class="value">72</span>
      </div>

      <div class="event-cover" aria-hidden="true"></div>
      <div class="event-text">3PM | KOALA AU CATCH UP</div>
    </section>
    <div class="spacer"></div>
  </main>
</body>
</html>
